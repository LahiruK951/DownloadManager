<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxDM remote</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --dim:#656d76; --line:#e2e5e9; --accent:#2f7cf6; --err:#d1242f; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#1f2228; --text:#e6e8eb; --dim:#9aa2ac; --line:#2e333b; --accent:#5b9bff; --err:#ff6b6b; --ok:#4cc26b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:8px; align-items:center; }
  header h1 { font-size:17px; margin:0; flex:1; }
  main { max-width:720px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; align-items:center; }
  .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--dim); font-size:13px; margin-top:4px; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  .err { color:var(--err); }
  .done { color:var(--ok); }
  .modes button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hidden { display:none; }
  #msg { min-height:20px; margin:6px 0; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>FluxDM</h1>
  <div class="modes row hidden" id="modes">
    <button data-mode="0">Snail</button><button data-mode="1">Medium</button><button data-mode="2">High</button>
  </div>
</header>
<main>
  <section id="login" class="card">
    <p>Enter the access code shown in FluxDM under Settings &gt; Remote.</p>
    <form id="loginForm" class="row">
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Access code" required>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <section id="app" class="hidden">
    <form id="addForm" class="card row">
      <input id="url" type="url" placeholder="Paste a link to download" required>
      <button class="primary" type="submit">Add</button>
    </form>
    <div class="row" style="margin-bottom:10px">
      <button id="pauseAll">Pause all</button><button id="resumeAll">Resume all</button>
      <span style="flex:1"></span><button id="logout">Sign out</button>
    </div>
    <div id="msg"></div>
    <div id="list"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("fluxdm-token") || "";

function fmtSize(b) {
  if (!(b >= 0)) return "";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 2 : 1) : b) + " " + u[i];
}
function say(text, bad) { const m = $("msg"); m.textContent = text || ""; m.className = bad ? "err" : ""; }

async function api(path, body) {
  const opt = { method: body ? "POST" : "GET", headers: { "X-FluxDM-Token": token } };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { signedOut(); throw new Error("Sign in again"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}

function signedIn() { $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("modes").classList.remove("hidden"); refresh(); }
function signedOut() { token = ""; sessionStorage.removeItem("fluxdm-token"); $("app").classList.add("hidden"); $("modes").classList.add("hidden"); $("login").classList.remove("hidden"); }

function render(data) {
  const list = $("list");
  list.replaceChildren();
  for (const d of data.downloads) {
    const card = document.createElement("div"); card.className = "card";
    const top = document.createElement("div"); top.className = "row";
    const title = document.createElement("div"); title.className = "title"; title.style.flex = "1"; title.textContent = d.title;
    top.append(title);
    if (!d.completed) {
      const b = document.createElement("button");
      b.textContent = d.paused ? "Resume" : "Pause";
      b.onclick = () => api(d.paused ? "/api/resume" : "/api/pause", { id: d.id }).then(refresh).catch((e) => say(e.message, true));
      top.append(b);
    }
    const meta = document.createElement("div"); meta.className = "meta";
    let parts = [d.state];
    if (d.total > 0) parts.push(fmtSize(d.received) + " of " + fmtSize(d.total));
    if (d.running && d.speed > 0) parts.push(fmtSize(d.speed) + "/s");
    if (d.error) { parts = [d.error]; meta.classList.add("err"); }
    if (d.completed) meta.classList.add("done");
    meta.textContent = parts.join(" · ");
    card.append(top, meta);
    if (!d.completed && d.progress >= 0) {
      const bar = document.createElement("div"); bar.className = "bar";
      const fill = document.createElement("div"); fill.style.width = Math.round(d.progress * 100) + "%";
      bar.append(fill); card.append(bar);
    }
    list.append(card);
  }
  if (!data.downloads.length) { const p = document.createElement("p"); p.className = "meta"; p.textContent = "No downloads yet."; list.append(p); }
  for (const b of document.querySelectorAll(".modes button")) b.classList.toggle("on", Number(b.dataset.mode) === data.mode);
}

async function refresh() {
  if (!token) return;
  try { render(await api("/api/downloads")); } catch (e) { say(e.message, true); }
}

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("code").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Error " + r.status);
    token = j.token; sessionStorage.setItem("fluxdm-token", token); $("code").value = ""; signedIn();
  } catch (err) { alert(err.message); }
};
$("addForm").onsubmit = async (e) => {
  e.preventDefault();
  try { await api("/api/add", { url: $("url").value }); $("url").value = ""; say("Added"); refresh(); }
  catch (err) { say(err.message, true); }
};
$("pauseAll").onclick = () => api("/api/pauseAll", {}).then(refresh).catch((e) => say(e.message, true));
$("resumeAll").onclick = () => api("/api/resumeAll", {}).then(refresh).catch((e) => say(e.message, true));
$("logout").onclick = () => api("/api/logout", {}).finally(signedOut);
for (const b of document.querySelectorAll(".modes button"))
  b.onclick = () => api("/api/mode", { mode: Number(b.dataset.mode) }).then(refresh).catch((e) => say(e.message, true));

if (token) signedIn();
setInterval(refresh, 2000);
</script>
</body>
</html>
